[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-model-bench"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
gguf-model-bench = "gguf_model_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["gguf_model_bench*"]
